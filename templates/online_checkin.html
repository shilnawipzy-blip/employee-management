{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Online Check In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow mx-auto" style="max-width: 600px;">

            <div class="card-body text-center">

                <h2 class="mb-4">
                    Online Check In
                </h2>

                <p class="text-muted">
                    Please look at the camera.
                </p>

                <video id="camera"
                       width="450"
                       height="250"
                       autoplay
                       playsinline
                       class="rounded border">
                </video>

                <canvas id="canvas" style="display: none;"></canvas>

                <br>

                <button id="checkInButton"
                        class="btn btn-primary mt-3">
                    Check In
                </button>

                <p id="cameraMessage"
                    class="mt-3 text-muted">
                </p>

                <!-- Employee Information -->
                <div id="employeeInfo"
                     class="card mt-4 text-start"
                     style="display: none;">

                    <div class="card-body">

                        <div class="row align-items-center">

                            <!-- Employee Photo -->
                            <div class="col-md-4 text-center">

                                <img id="employeePhoto"
                                     src=""
                                     alt="Employee Photo"
                                     class="rounded border"
                                     width="140"
                                     height="140"
                                     style="object-fit: cover;">

                            </div>

                            <!-- Employee Details -->
                            <div class="col-md-8">

                                <h5 class="card-title text-success mb-3">
                                    Employee Details
                                </h5>

                                <p class="mb-1">
                                    <strong>Name:</strong>
                                    <span id="employeeName"></span>
                                </p>

                                <p class="mb-1">
                                    <strong>Email:</strong>
                                    <span id="employeeEmail"></span>
                                </p>

                                <p class="mb-1">
                                    <strong>Phone:</strong>
                                    <span id="employeePhone"></span>
                                </p>

                                <p class="mb-0">
                                    <strong>Designation:</strong>
                                    <span id="employeeDesignation"></span>
                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        const detectFaceUrl = "{% url 'detect_face' %}";
    </script>

    <script src="{% static 'js/online_checkin.js' %}"></script>

</body>
</html>
