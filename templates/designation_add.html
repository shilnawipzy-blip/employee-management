
<!DOCTYPE html>
<html>
<head>
    <title>Add Designation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        .errorlist {
            color: red;
            list-style: none;
            padding: 0;
            margin-top: 5px;
        }
    </style>
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width: 600px;">

        <div class="card-body">

            <h2 class="text-center mb-4">
                Add Designation
            </h2>

            <form method="POST">

                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">
                        Designation
                    </label>
                    {{ form.name }}

                    {% if form.name.errors %}
                        {{ form.name.errors }}
                    {% endif %}

                </div>
                <button type="submit"
                        class="btn btn-primary">
                    Save Designation
                </button>

                <a href="/designations/"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
