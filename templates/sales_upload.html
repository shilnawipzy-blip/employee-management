<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Sales Report</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f5f7fb;
        }

        .upload-card {
            max-width: 620px;
            margin: 90px auto;
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .upload-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .file-box {
            border: 2px dashed #d7dce5;
            border-radius: 12px;
            padding: 28px;
            background: #fafbfc;
        }

        .btn-upload {
            padding: 11px 28px;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card upload-card">
        <div class="card-body p-5 text-center">

            {% if error_message %}
                <div class="alert alert-danger text-start">
                    {{ error_message }}
                </div>
            {% endif %}

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                {% csrf_token %}

                <div class="file-box mb-4">

                    <label
                        for="excel_file"
                        class="form-label fw-semibold"
                    >
                        Select File
                    </label>

                    <input
                        type="file"
                        name="excel_file"
                        id="excel_file"
                        class="form-control mt-2"
                        accept=".xlsx,.xls,.csv"
                        required
                    >
                </div>
                

<div class="mt-4 d-flex gap-2">

    <button type="submit" class="btn btn-primary">
        Upload
    </button>

    <a
        href="{% url 'sales_list' %}"
        class="btn btn-secondary"
    >
        Back
    </a>

</div>
</form>
        </div>
    </div>

</div>

</body>
</html>
