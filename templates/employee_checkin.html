<!DOCTYPE html>
<html>
<head>
    <title>Employee Check In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow mx-auto" style="max-width: 600px;">

            <div class="card-body text-center">

                <h2 class="mb-4">
                    Employee Check In
                </h2>

                <p class="text-muted">
                    Please look at the camera.
                </p>

                <video id="camera"
                    width="450"
                    height="250"
                    autoplay
                    playsinline
                    class="rounded border">
                </video>

                <canvas id="canvas" style="display: none;"></canvas>

                <button id="startCamera"
                        class="btn btn-primary mt-3">
                    Start Camera
                </button>

                <p id="cameraMessage"
                   class="mt-3 text-muted">
                </p>
                <div id="employeeDetails"
     class="card mt-3 text-start"
     style="display: none;">

<div class="card-body">

    <div class="row align-items-center">
        <div class="col-md-4 text-center">

            <img id="employeePhoto"
                src=""
                alt="Employee Photo"
                class="rounded border"
                width="140"
                height="140"
                style="object-fit: cover;">

        </div>


        <!-- Employee Details -->
        <div class="col-md-8">

            <h5 class="card-title text-success mb-3">
                Employee Details
            </h5>

            <p class="mb-1">
                <strong>Name:</strong>
                <span id="employeeName"></span>
            </p>

            <p class="mb-1">
                <strong>Email:</strong>
                <span id="employeeEmail"></span>
            </p>

            <p class="mb-1">
                <strong>Phone:</strong>
                <span id="employeePhone"></span>
            </p>

            <p class="mb-0">
                <strong>Designation:</strong>
                <span id="employeeDesignation"></span>
            </p>

        </div>

    </div>

</div>
            </div>

        </div>

    </div>


<script>

    const camera = document.getElementById('camera');
    const startCamera = document.getElementById('startCamera');
    const cameraMessage = document.getElementById('cameraMessage');
    const canvas = document.getElementById('canvas');
    const employeeDetails =
    document.getElementById('employeeDetails');

    const employeePhoto =
        document.getElementById('employeePhoto');

const employeeName =
    document.getElementById('employeeName');

const employeeEmail =
    document.getElementById('employeeEmail');

const employeePhone =
    document.getElementById('employeePhone');

const employeeDesignation =
    document.getElementById('employeeDesignation');

    let stream = null;
    let detectionInterval = null;


    // Start Camera
    startCamera.addEventListener('click', async function () {

    startCamera.disabled = true;

    startCamera.innerHTML = `
        <span class="spinner-border spinner-border-sm me-2"
              role="status"
              aria-hidden="true"></span>
        Starting Camera...
    `;

    cameraMessage.textContent =
        'Please wait... starting camera.';

    cameraMessage.className =
        'mt-3 text-muted';

    try {

            stream = await navigator.mediaDevices.getUserMedia({
                video: true
            });

            camera.srcObject = stream;

            cameraMessage.textContent =
    'Camera started. Looking for your face...';

cameraMessage.className =
    'mt-3 text-muted';

startCamera.innerHTML =
    'Camera Started ✓';

startFaceDetection();

        } catch (error) {

    cameraMessage.textContent =
        'Camera access denied or unavailable.';

    cameraMessage.className =
        'mt-3 text-danger';

    startCamera.disabled = false;

    startCamera.innerHTML =
        'Start Camera';

    console.error(error);
}

    });


    // Send camera frame to Django/OpenCV
    function startFaceDetection() {

        detectionInterval = setInterval(async function () {

            if (camera.videoWidth === 0) {
                return;
            }

            canvas.width = camera.videoWidth;
            canvas.height = camera.videoHeight;

            const context = canvas.getContext('2d');

            context.drawImage(
                camera,
                0,
                0,
                canvas.width,
                canvas.height
            );

            const imageData =
                canvas.toDataURL('image/jpeg');


            const formData = new FormData();

            formData.append('image', imageData);


            try {

                const response = await fetch(
                    "{% url 'detect_face' %}",
                    {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-CSRFToken': getCookie('csrftoken')
                        }
                    }
                );


                const data = await response.json();


                if (data.face_detected && data.employee_name) {

                        cameraMessage.textContent =
                            '✓ Employee identified: ' + data.employee_name;

                        cameraMessage.className =
                            'mt-3 text-success fw-bold';
                            employeePhoto.src = data.photo;
                            employeeName.textContent = data.employee_name;
                            employeeEmail.textContent = data.email;
                            employeePhone.textContent = data.phone;
                            employeeDesignation.textContent = data.designation;

                            employeeDetails.style.display = 'block';

                        clearInterval(detectionInterval);
                        

                        if (stream) {
                            stream.getTracks().forEach(
                                track => track.stop()
                            );
                        }

                        camera.srcObject = null;

                    } else if (data.face_detected) {

                    cameraMessage.textContent =
                        '✓ Face detected, but employee not recognized.';

                    cameraMessage.className =
                        'mt-3 text-warning fw-bold';

                } else {

                    cameraMessage.textContent =
                        'No face detected. Please look at the camera.';

                    cameraMessage.className =
                        'mt-3 text-danger';

                }

            } catch (error) {

                console.error(error);

            }

        }, 1000);

    }


    // Get Django CSRF token
    function getCookie(name) {

        let cookieValue = null;

        if (document.cookie && document.cookie !== '') {

            const cookies = document.cookie.split(';');

            for (let cookie of cookies) {

                cookie = cookie.trim();

                if (cookie.startsWith(name + '=')) {

                    cookieValue =
                        decodeURIComponent(
                            cookie.substring(name.length + 1)
                        );

                    break;
                }
            }
        }

        return cookieValue;
    }

</script>

</body>
</html>
