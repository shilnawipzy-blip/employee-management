<!DOCTYPE html>
<html>
<head>
    <title>Edit Designation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width: 600px;">

        <div class="card-body">

            <h2 class="text-center mb-4">
                Edit Designation
            </h2>

            <form method="POST">

                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">
                        Designation
                    </label>

                    {{ form.name }}

                    {% if form.name.errors %}
                        {{ form.name.errors }}
                    {% endif %}

                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Update Designation
                </button>

                <a href="/designations/"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>

    </div>

</div>

</body>
</html>
